<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Twerk Factory</title>
  <style>
    :root {
      --sunshine: #fff7ad;
      --lemon: #ffe45c;
      --gold: #f5bb18;
      --honey: #b87908;
      --ink: #4a3500;
      --panel: rgba(255, 255, 255, 0.72);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, sans-serif;
      background: linear-gradient(145deg, #fffbd4, #ffe878 55%, #f8c837);
    }

    header {
      padding: 22px 16px 10px;
      text-align: center;
    }
